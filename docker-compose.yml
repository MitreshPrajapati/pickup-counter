services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: snack_dispenser_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snack_dispenser
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snack_dispenser"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Backend Express API Service
  backend:
    container_name: snack_dispenser_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snack_dispenser?schema=public
      WEBHOOK_SECRET: super_secret_webhook_signing_key_snack_dispenser_2026
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Kiosk Client Service
  client:
    container_name: snack_dispenser_client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
      WEBHOOK_SECRET: super_secret_webhook_signing_key_snack_dispenser_2026
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
